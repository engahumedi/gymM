services:
  - type: web
    name: gym-app
    env: node
    region: oregon
    plan: free
    buildCommand: >-
      cd frontend && npm ci && npm run build &&
      cp -r dist ../backend/public &&
      cd ../backend && npm ci && npm run build &&
      NODE_ENV=production npx tsx src/db/seed.ts
    startCommand: cd backend && NODE_ENV=production node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: DB_PATH
        value: /data/gym.db
    disk:
      name: gym-sqlite
      mountPath: /data
      sizeGB: 1
