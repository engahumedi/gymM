name: CI

# Runs on every branch and every pull request, so a type error or a failing
# unit test is caught before it can reach main (and therefore Pages).
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# One run per ref: a new push supersedes the previous, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
